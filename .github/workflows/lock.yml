name: 'Lock threads'

on:
  schedule:
    - cron: '0 0 * * *'

permissions: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          github-token: ${{ github.token }}
          issue-lock-inactive-days: '180'
